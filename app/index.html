<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TNAA Transit · trasporti pubblici</title>
  <meta name="theme-color" content="#1f5f3f">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <aside id="panel">
    <header>
      <h1>TNAA Transit</h1>
      <p id="status">Caricamento…</p>
      <button id="btn-refresh" title="Scarica subito ritardi e orari nuovi">Aggiorna</button>
    </header>
    <div id="banner" hidden></div>
    <input id="search" type="search" placeholder="Cerca fermata, stazione o linea" autocomplete="off">
    <div id="filters">
      <label><input type="checkbox" id="f-bus" checked> Bus</label>
      <label><input type="checkbox" id="f-rail" checked> Treni</label>
      <label><input type="checkbox" id="f-rt"> Solo con dati live</label>
    </div>
    <div id="content"></div>
    <footer>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>In orario</span>
        <span><i style="background:var(--warn)"></i>2–5 min</span>
        <span><i style="background:var(--late)"></i>Oltre 5 min</span>
        <span><i style="background:var(--early)"></i>In anticipo</span>
        <span><i class="hollow"></i>Solo orario</span>
      </div>
      <p>Le posizioni sono <strong>stimate</strong>, non GPS. <a href="come-funziona.html">Come funziona</a></p>
      <p>© Alessandro Roat · <a href="https://github.com/alexroat/tnaa-transit">CC BY-NC 4.0</a> · Progetto indipendente</p>
    </footer>
  </aside>
  <button id="btn-3d" title="Passa da 3D a 2D">2D</button>
  <script type="module" src="js/main.js"></script>
</body>
</html>
